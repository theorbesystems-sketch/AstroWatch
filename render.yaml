services:
  # Backend: AstroWatch API (FastAPI)
  - type: web
    name: astrowatch-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: astroguard-backend
    envVars:
      - key: NASA_API_KEY
        sync: false # User must provide this in the Render Dashboard
      - key: ALLOWED_ORIGIN
        value: https://astrowatch-ui.vercel.app # Example, user will update

  # Frontend: AstroWatch UI (Static)
  - type: web
    name: astrowatch-ui
    env: static
    buildCommand: npm install && npm run build
    publishPath: dist
    rootDir: astroguard-frontend
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: astrowatch-api
          type: web
          property: host
